services:
  # ── Backend: Flask API + Playwright scraper ──
  - type: web
    name: kairon-api
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt && PLAYWRIGHT_BROWSERS_PATH=0 python -m playwright install chromium
    startCommand: gunicorn -w 1 -b 0.0.0.0:$PORT app:app --timeout 180
    healthCheckPath: /api/config
    rootDir: backend/
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: roll_no
        sync: false
      - key: password
        sync: false

  # ── Frontend: React SPA static site ──
  - type: static_site
    name: kairon-frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    rootDir: frontend/
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://kairon-api.onrender.com/api
